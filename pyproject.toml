[project]
name = "swotvac-saviour"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CachyOSMir", email = "mirazrai20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[project.scripts]
swotvac-saviour = "swotvac_saviour:main"

[build-system]
