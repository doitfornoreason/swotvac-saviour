<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}swotvac-saviour{% endblock %}</title>
  <script>
    // Set the theme before first paint to avoid a flash; theme.js handles clicks.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* storage unavailable: OS preference applies */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v('style.css') }}">
  <link rel="stylesheet" href="/static/katex/katex.min.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/katex/katex.min.js" defer></script>
  <script src="/static/theme.js?v={{ static_v('theme.js') }}" defer></script>
  <script src="/static/play.js?v={{ static_v('play.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/play">Play</a>
      <a href="/browse">Browse</a>
      <a href="/tags">Tags</a>
      <a href="/setup">Setup</a>
      <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </nav>
  </header>
  <main>
  {% block content %}{% endblock %}
  </main>
</body>
</html>
