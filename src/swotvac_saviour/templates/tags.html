{% extends "base.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
<h1>Tags</h1>
<form method="post" action="/tags" hx-post="/tags" hx-swap="none">
  <input type="text" name="name" placeholder="new tag name" required>
  <button type="submit">Create tag</button>
</form>
<ul>
{% for t in tags %}
  <li><a href="/tags/{{ t.id }}/questions">{{ t.name }}</a></li>
{% else %}
  <li><em>No tags yet. Create one above, or at any upload time.</em></li>
{% endfor %}
</ul>
{% endblock %}
